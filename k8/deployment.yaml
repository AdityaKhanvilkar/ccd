apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentapp-deployment
  labels:
    app: studentapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studentapp
  template:
    metadata:
      labels:
        app: studentapp
    spec:
      containers:
      - name: studentapp
        image: docker.io/adityakhanvilkar/cca-studentapp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000